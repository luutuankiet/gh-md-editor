<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gh-md-editor — server</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231e1e1e'/%3E%3Cpath d='M4.6 4.4 1.8 8l2.8 3.6' fill='none' stroke='%23e58520' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M11.4 4.4 14.2 8l-2.8 3.6' fill='none' stroke='%23e58520' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M9.4 3.4 6.6 12.6' fill='none' stroke='%23c5c8c6' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <!--
      Boot skeleton. Everything here is inline on purpose: it has to paint from
      the first response alone, before a single asset has been requested. Over a
      long-haul link that gap is seconds rather than milliseconds - measured at
      roughly five between the document arriving and the app appearing, Ho Chi
      Minh to Helsinki - and it used to be seconds of blank page with no way to
      tell a slow load from a broken one.

      It retires itself with no script involved. #app stays empty until the app
      mounts into it, so a sibling rule keyed on :not(:empty) hides the skeleton
      the moment there is something real behind it: no teardown to forget,
      nothing left behind if mounting throws, and no reason for the bundle to
      know this exists. Keep #app written with nothing inside it - a single
      space makes it never :empty, and the skeleton would never show at all.
    -->
    <style>
      body { margin: 0; background: #1e1e1e; }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        background: #1e1e1e;
        overflow: hidden;
      }
      #app:not(:empty) ~ #boot { display: none; }
      #boot i {
        display: block;
        border-radius: 3px;
        background: #2f2f2f;
        animation: bootpulse 1.4s ease-in-out infinite;
      }
      #boot .top {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: none;
        height: 35px;
        padding: 0 12px;
        background: #252526;
        border-bottom: 1px solid #333;
      }
      #boot .mid { display: flex; flex: 1 1 auto; min-height: 0; }
      #boot .side {
        flex: none;
        width: 240px;
        padding: 14px 12px;
        background: #252526;
        border-right: 1px solid #333;
      }
      #boot .main { flex: 1 1 auto; min-width: 0; padding: 18px 22px; }
      #boot .side i { height: 9px; margin-bottom: 12px; }
      #boot .main i { height: 10px; margin-bottom: 14px; }
      #boot .bar {
        flex: none;
        height: 22px;
        background: #007acc;
        opacity: 0.5;
      }
      /* Staggered so the eye reads it as one wave rather than a flat blink,
         which is what makes it feel like progress instead of a frozen mock. */
      #boot i:nth-child(2) { animation-delay: 0.1s; }
      #boot i:nth-child(3) { animation-delay: 0.2s; }
      #boot i:nth-child(4) { animation-delay: 0.3s; }
      #boot i:nth-child(5) { animation-delay: 0.4s; }
      #boot i:nth-child(6) { animation-delay: 0.5s; }
      #boot i:nth-child(7) { animation-delay: 0.6s; }
      @keyframes bootpulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.8; }
      }
      /* Someone who asked for less motion gets the layout without the wave. */
      @media (prefers-reduced-motion: reduce) {
        #boot i { animation: none; opacity: 0.45; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" aria-hidden="true">
      <div class="top"><i style="width: 150px; height: 11px"></i><i style="width: 110px; height: 11px"></i></div>
      <div class="mid">
        <div class="side">
          <i style="width: 60%"></i><i style="width: 85%"></i><i style="width: 72%"></i>
          <i style="width: 90%"></i><i style="width: 55%"></i><i style="width: 78%"></i>
          <i style="width: 66%"></i>
        </div>
        <div class="main">
          <i style="width: 38%; height: 18px; margin-bottom: 22px"></i>
          <i style="width: 92%"></i><i style="width: 78%"></i><i style="width: 85%"></i>
          <i style="width: 61%"></i><i style="width: 88%"></i><i style="width: 44%"></i>
        </div>
      </div>
      <div class="bar"></div>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
